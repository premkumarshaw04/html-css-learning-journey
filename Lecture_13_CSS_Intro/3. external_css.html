<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <!-- linking external css file -->
    <link rel="stylesheet" href="external.css">

    <style>
        p{
            background-color: green;
        }
    </style>

</head>
<body>
    <h1>Welcome to code help</h1>

    <!-- if we try to apply bg color propety on a paragrah by using three methods
     inline css, internal css and external css , which property will be applied on the paragraph -->
     <p style="background-color: aqua;">
        Lorem ipsum, dolor sit amet consectetur adipisicing elit. Dolorem ut blanditiis iure at. Dolore dolorum exercitationem illo, atque esse molestiae!
     </p>
     <!-- so always the property which is added by inline css will be applied. (always remember) -->
</body>
</html>
