<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset> <!--pura ka pura form ka content is fieldset me lie karta hai-->
            <legend>HTML Form Dummy</legend> <!--legend tag provides the name or caption to the fieldset-->
            <label for="datepicker">Choose date</label>
            <input type="date" id="datepicker">
            <br/>
            <br/>

            <label for="selector1">Chosse your Dish</label>
            <select name="dishes" id="selector1"> <!--isse hmne ek dropdown banaya-->
                <option value="biryani">Biryani</option>
                <option value="kebab">Kebaab</option>
                <option value="chicken leg piece">Chicken Leg Piece</option>
            </select>
            <br/>
            <br/>
            <button>Mai hu button</button>
            <br/>
            <br/>

            <label for="text1">Enter your text : </label>
            <br/>
            <br/>
            <textarea name="anyText" id="text1" cols="10" rows="5" placeholder="Enter text here"></textarea>

        </fieldset>
    </form>
</body>
</html>
