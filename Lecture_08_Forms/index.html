<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">

        <label for="email">Enter Email ID:</label>
        <input type="text" id="email" placeholder="Enter your email here"> <!other-- ek faded text hota hai value nhi hoti hai ...ye hme idead deta hai ki yaha kya fill karna hai-->
        <!-- label ko input tag se attach karna bhot important hai  -->
        <!-- we have to keep the (for of label tag) and (id of input tag) for linking them each other--> 
        <br/>
        <br/>

        <label for="password1">Enter Password</label>
        <input type="password" id="password1" placeholder=" Enter your Password">
        <br/>
        <br/>

        <!-- creating button -->
        <input type="submit" value="Submit"> 
        <!-- (type="submit") means pure form ka ye submit button hai  -->
        <!-- (value="Submit") means jo button hm create karenge us button ke upar kya text aana chahiye -->

        <!-- we can also create button by using button tag -->
        <button>Click</button>

    </form>
</body>
</html>
