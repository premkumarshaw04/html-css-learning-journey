<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout 1</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            height: 100vh;
            width: 100vw;
        }
        .container{
            height: 100%;
            width: 100%;
            background-color: rgb(55, 50, 50);

            /* conatiner ko grid bana rhe hai  */
            display: grid; /*Ab mera container grid ban chuka hai*/
            /* now we can use the properties of grid  */
            padding: 4rem;

            /* row-gap: 1rem;  || isse rows ke bich me gap ban jayegi
            column-gap: 1rem; */
            gap: 1rem;/*Shorthand notation of both row and column gap*/

            /* Using fractional Units  */
            /* grid-template-rows: 1fr 1fr;       We can write this line using repeat()*/
            grid-template-rows: repeat(4, 1fr);
            grid-template-columns: repeat(3, 1fr);
        }

        .item{
            background-color: rgb(63, 63, 169);
            border: 5px solid black;
            color: white;
            font-size: 2.3rem;

            /* ab text centre me place ho jayega */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* same properties header and footer dono me apply hongi  */
        .header, .footer{
            /* header and footer column line no 1 se 4 tak ja raha hai  */
            grid-column-start: 1;
            grid-column-end: 4;
        }

        .sidebar{
            grid-row-start: 2;
            grid-row-end: 4;
        }
        .content1{
            /* column line no 2 se 4 tak content 1 hai  */
            grid-column-start: 2;
            grid-column-end: 4;
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- item no 1 ko header bana rhe hai -->
        <div class="item header">Header</div> <!-- ye item two class se belong karta hai -->
        
        <!-- item no 2 ko Side bar bana rhe hai -->
        <div class="item sidebar">Sidebar</div>

        <!-- item no 3 ko content1 bana rhe hai -->
        <div class="item content1">Content1</div>

        <!-- item no 4 ko content2 bana rhe hai -->
        <div class="item content2">Content2</div>

        <!-- item no 5 ko content3 bana rhe hai -->
        <div class="item content3">Content3</div>

        <!-- item no 6 ko footer bana rhe hai -->
        <div class="item footer">Footer</div>
    </div>
</body>
</html>
