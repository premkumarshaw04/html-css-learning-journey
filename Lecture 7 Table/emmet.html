<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 1.ek paragraph ke andar ek img tag chahiye
    p>img + enter -->
    <p><img src="" alt=""></p>
     
    <!-- 2.p ke andar p ke andar p ke andar p ke andar chahiye 
    p>p>p>p + enter -->
    <p>
        <p>
            <p>
                <p></p>
            </p>
        </p>
    </p>

    <!-- 3.nesting karne ke liye >(greater than sign ka use karte hai) -->
     
    <!-- 4. p ke h1 insert karni hai
    p>h1 + enter -->
    <p>
        <h1></h1>
    </p>

    <!-- 5.side by side tags insert karne ke liye + (plus sign )ka use karte hai
    article+section + enter -->
    <!-- + ka use karne par tags siblings ke tarah act karte hai -->
    <article></article>
    <section></section>

    <!-- 6.p ke andar koi content insert karna hai
    p{This is my Fisrt para} + enter -->
    <p>This is my Fisrt para</p>

    <!-- 7.h3 ke andar koi content insert karna hai
    h3{This is my Fisrt para} + enter -->
    <h3>This is my Fisrt heading</h3>

    <!-- 8.article or section ke andar content insert karna hai
    article{This is my Fisrt article} + enter
    section{This is my Fisrt section} + enter -->
    <article>This is my Fisrt article</article>
    <section>This is my Fisrt section</section>

    <!-- 9.p ke andar a tag nest karna hai
    p>a + enter -->
    <p><a href=""></a></p>

    <!-- 10.p ke sath a chahiye alag alag (side by sude)
    p+a enter -->
    <p></p>
    <a href=""></a>
    
    <!-- 11. p ke andar lorem dalna hai 
    p>lorem7 + enter -->
    <p>Lorem ipsum dolor, sit amet consectetur adipisicing.</p>

    <!-- 12.p ke andar apna content dalna hai 
    p{This is my own content} + enter -->
    <p>This is my own content</p>

    <!-- 13.id creation
    id attribute har kisi element ko uniqually identify karta hai ...ek web page har kisi element ki id alag alag hogi
    
    p#para1 + enter
    ek paragraph element ban gaya jiski id para1 hogi -->
    <p id="para1"></p>

    <!-- article#article1 + enter
    ek article ban gaya jiski id article1 aa gayi -->
    <article id="article1"></article>

    <!-- ek section ban gayi jiski id babbar aa gai -->
    <!-- section#babbar + enter -->
    <section id="babbar"></section>

    <!-- 14.class creation 
    class create karne ke liye .(dot) ka use kiya jata hai

    class ek parent level entity hai jise dog class ke andar har ek tarah ke dogs aayenge
    class me multiple element exixt kar sakte hai... class hm elements ki grouping ke liye use karte hai  -->
    
    <!-- p.para + enter
    p paragraph element ban gaya jiski class define ho gayi para -->
    <p class="para"></p>

    <!-- ek article element ban gaya jiski class define ho gayi dog --> -->
    <article id="dog"></article>

    <!-- multiple classes
    section.dog.lion.cat + enter 
    is section ke liye multiple classes batai gayi hai -->
    <section class="lion dog cat"></section>




</body>
</html>
