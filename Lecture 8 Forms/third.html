<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form >
        <label for="textfield1">TextField : </label>
        <input type="text" name="text1" id="textfield1"> <!--by default input tag ka type text hi hota hai-->
        <br/>
        <br/>

        <label for="button1">Button : </label>
        <input type="submit" name="button1" id="button1" value="Subscribe">
        <br/>
        <br/>

        <!-- creating radio button -->
        <label for="radio1">Male : </label>
        <input type="radio" name="radiobutton" id="radio1">
    
        <!-- multiple radio button -->
        <label for="radio2">Female : </label>
        <input type="radio" name="radiobutton2" id="radio2">
        
        <label for="radio3">Prefer not to say : </label>
        <input type="radio" name="radiobutton3" id="radio3">
        <br/>
        <!-- checkbox -->
        <label for="checkbox1">English : </label>
        <input type="checkbox" name="checkbox1" id="checkbox1">

        <label for="checkbox2">Hindi : </label>
        <input type="checkbox" name="checkbox2" id="checkbox2">
        <br/>
        <br/>
        <!-- file selection -->
        <label for="fileselect1">Hindi : </label>
        <input type="file" name="fileselection" id="fileselect1">
        <br/>
        <br/>
        <!-- image button creation -->
        <input type="image" name="arrowImage" id="image1" src="button1.jpg" alt="Click here" height="15px" width="15px">

        <label for="datepicker1">Enter date</label>
        <input type="date" id="datepicker1" name="date">
    </form>
</body>
</html>
