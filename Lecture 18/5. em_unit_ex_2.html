<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        /* Talking about em(unit) */

        .container{
            font-size: 10px;
        }

        .box{
            font-size: 10em;
            /* em unit is realtive to parent container's font size */
            /* parent here is container and it has forn size 10 px
            so relatively 1 em = relative size of parent
            1 em = 10px
            so 10 em = 100px*/
        }
        
        
    </style>
</head>
<body>
    <p>
        Hello ji
    </p>

    <div class="container">
        <div class="box">
            Welcome to codehelp
        </div>
    </div>

</body>
</html>
