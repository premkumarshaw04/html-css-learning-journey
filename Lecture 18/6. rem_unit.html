<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        /* we always try ki hm absolute(fixed size) ki unit jyada na use kare, because hm responsive design wala website banana chahte  hai*/
        /* jyada se jyada relative units ka use kare */
        /* responsive means, jis bhi dimmension ki screen hm use kar rhe hai(mobile, laptop, ipad), website usike dimmension ke according behave kare */

        .firstPara{
            border: 1px solid black;
            font-size: 5rem;
            /* Talking about rem(unit) => It depends on root element */
            /* by default root element ki dafault dimmension 16px hoti hai*/

            /* so 1 rem = 16px 
            5 rem = 80px */
        }
        
        
    </style>
</head>
<body>
    <p class="firstPara">
        Hello ji
    </p>


</body>
</html>
