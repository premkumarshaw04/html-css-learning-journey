<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- UTF-8 ek one of the popular character encoding hai jisse multi lingual support add kar skate hai ....multiple language support ke liye hm iska use karte hai, hm koi bhi characters add kar sakte hai -->

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Jab bhi hm render kar rahe honge internet explorar ke upar to ap jo bhi sbse latest ranedering engine hoga usko use kar rhe hoge.....isse hmne ek standard set kar diya ek uniformity maintain kar di...isse different different randering of same website ho rahi thi ab wo nhi hogi , wo ab har jagah same dekhegi-->


    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- yaha par hm baat kar rahe hai viewport ki to browser me jo window dikh rahi hoti hai jaha par hmari content display hoti hai ,wo hmara viewport hota hai 
    (initial-scale=1.0 ) (default zoom will 1.0 menas 100% rahega )iska matlab hai jo default level hai zoom ka wo rahega (100% is the default zoom level) 
    ( content="width=device-width,)iska matlab yaha par hmne ye set kiya ki hmari website jo open hoga uski width depend karege device ke width pe....wo website ki width device ke according change hogi ....agar mobile peuse karenge to wo uski width le legi, laptop pe use karenge to wo uski width le legi-->


    <title>Favicon, Meta, Title, etc</title> 
    <!--This will be visble on the title bar as a title of the webpage-->

    <meta name="description" content="This website aims to create India's best Coders">
    <!-- meta tag ka intent SEO(Search engine optimization) ki abilities ko badhane ke liye hai ///// this will not be shown in the User interface-->

    <meta name="keywords" content="codehelp, Operating System">
    <!-- jab bhi aise koi keywords search ho to mere website bhi wha par rank kare -->


    <link rel="shortcut icon" href="./imageFile.png" type="image/x-icon"> <!--for adding logo with the title-->
    <!--  favicon ki image root directory ke andar honi chahiye....pehle image ko hmesa roo directory me save karo-->


    <link rel="stylesheet" href="style.css"> <!--linking css file with html using link tag-->
    <script src="script.js"></script> <!--Linking java script file-->
    
</head>
<body>
    <h1>Welcome to CodeHelp</h1>
    <button>Submit</button>
</body>
</html>
