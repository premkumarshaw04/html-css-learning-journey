<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            height: 100vh;
            width: 100vw;
        }
        .container{
            height: 100%;
            width: 100%;
            background-color: rgb(55, 50, 50);

            /* conatiner ko grid bana rhe hai  */
            display: grid; /*Ab mera container grid ban chuka hai*/
            /* now we can use the properties of grid  */
            padding: 4rem;

            row-gap: 1rem; /*isse rows ke bich me gap ban jayegi*/
            column-gap: 1rem;

            /* Using fractional Units  */
            /* grid-template-rows: 1fr 1fr;       We can write this line using repeat()*/
            grid-template-rows: repeat(2, 1fr);/*1fr ko 2 baar reapeat karna hai*/
            grid-template-columns: repeat(3, 1fr);
        }

        .item{
            background-color: rgb(63, 63, 169);
            border: 5px solid black;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">item1</div>
        <div class="item">item2</div>
        <div class="item">item3</div>
        <div class="item">item4</div>
        <div class="item">item5</div>
        <div class="item">item6</div>
    </div>
</body>
</html>
