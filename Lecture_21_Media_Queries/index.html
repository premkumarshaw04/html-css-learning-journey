<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            background-color: aqua;
            width: 400px;
            height: 400px;
            border: 3px solid black;
            
        }
        .box2{
            background-color: aqua;
            width: 400px;
            height: 400px;
            border: 3px solid black;
            
        }
        .box3{
            background-color: aqua;
            width: 400px;
            height: 400px;
            border: 3px solid black;
            
        }
        @media (min-width: 500px) {
            .box{ /*500px se upar jate hi mai color change hoke green ho jayega and 500px se niche tak color aqua hi rhega*/
                background-color: green;
            }
        }
        @media (max-width: 500px) {
            .box2{ /*0 se 500px tak green hi rhega, and 500px ke baad default jo color(aqua) diya hua hai wo ho jayega*/
                background-color: green;
            }
        }

        /*300 px se 500px tak mera box green color ka rhega and uske alawa aqua color ka rhega*/
        @media (min-width: 300px) and (max-width: 500px) {
            .box3{
                background-color: green;
            }
        }
    </style>
</head>
<body>
    <div class="box">
        Hello jee
    </div>

    <div class = "box2">
        Hello jee 2
    </div>
    
    <div class = "box3">
        Hello jee 3
    </div>
    
</body>
</html>
