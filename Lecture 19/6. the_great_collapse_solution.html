<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .box{
            border: 1px solid black;
            overflow: auto; /*by this way we can solve the problem of the great collapse*/
        }
        .item{
            width: 200px;
            height: 200px;
            margin: 2px;
            background-color: aquamarine;
            border: 1px solid black;

            float: left;
            /* float left karne se hmara parent box collapse kar gaya  */

            /* we can solve this probelm by using overflow keyword, we just have to mark the box as (overflow: auto) */
        }

        #item1{
            float: right;
        }

        #item2{
            float: right;
        }

        #item3{
            float: right;
        }



        /* note : float ki wajh se kahi agar collapsing ho rahi hai to waha hm "clear" ka use kar sakte hai */
    </style>
</head>
<body>
    <div class="box">
        <div class="item" id="item3">A</div>
        <div class="item" id="item3">B</div>
        <div class="item" id="item3">C</div>
    </div>
</body>
</html>
