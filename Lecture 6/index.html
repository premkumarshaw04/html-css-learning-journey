<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- table making -->
    <table border="1">
        <thead>
            <th>Student Id</th>
            <th>Student Name</th>
            <th>Gender</th>
            <th>Age</th>
        </thead>
        <tbody>
            <!-- hmara actual content tbody ke andar aayega , table rows-->
            <!-- body ke anadar 4 rows hai,har ek row me 4 cells hai -->
            <tr>
                <td>1234</td>
                <td colspan="3">Ramesh</td>
                <!-- <td>Male</td>
                <td>17</td> -->
            </tr>
            <tr>
                <td>5678</td>
                <td>Suresh</td>
                <td>Male</td>
                <td rowspan="3">17</td> <!--hmne is ko extend kardiya 4th row tak by the help of rowspan-->
            </tr>
            <tr>
                <td>8975</td>
                <td>Hitesh</td>
                <td>Male</td>
                <!-- <td>17</td> -->
            </tr>
            <tr>
                <td>5678</td>
                <td>Raghav</td>
                <td>MAle</td>
                <!-- <td>17</td> -->
            </tr>
        </tbody>
    </table>



</body>
</html>
