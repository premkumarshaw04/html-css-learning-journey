<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        /* Talking about percentage %(unit) */

        .parent{
            border: 1px solid black;
            background-color: beige;
        }

        .child{
            border: 1px solid green;
            background-color: aqua;
            width: 50%;
            /* 50% of what? => 50% of parent ki width */
        }
    </style>
</head>
<body>
    <!-- <div class="box">
        Welcome to code help
    </div> -->

    <div class="parent">
        <div class="child">
            CHILD
        </div>
    </div>
</body>
</html>
