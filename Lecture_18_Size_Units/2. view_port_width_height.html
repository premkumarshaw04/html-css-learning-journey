<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        /* it is a good practice */
        *{
            margin: 0;
            padding: 0;
        }

        /* Talking about view port width and height(units) */
        .container{
            background-color: beige;
            border: 1px solid red;

            height: 100vh;
            /* 100vh means 100% of view port ki height  */

            width: 50vw;
            /* 50vw means 50% of view port ki width  */
        }
        
    </style>
</head>
<body>
    <div class="container">
        Welcome to code help
    </div>

</body>
</html>
