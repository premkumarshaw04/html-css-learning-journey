<body>
   <!-- 1.ek unordered list ke abdar 7 ite,s chahiye
   ul>li*7 + enter -->
   <ul>
    <li>PREM</li>
    <li>PREM</li>
    <li>PREM</li>
    <li>PREM</li>
    <li>PREM</li>
    <li>PREM</li>
    <li>PREM</li>
   </ul>
    <!-- 2. ek ul ke andar 7 list chahiye har ek list ke andar ek paragraph ho or usparagraph ke andar ek list item honi chahiye
    ul>(li>p>a)*7 + enter -->
    <ul>
        <li>
            <p><a href="https://www.google.com">Google</a></p>
        </li>
        <li>
            <p><a href="https://www.google.com">google</a></p>
        </li>
        <li>
            <p><a href="https://www.facebook.com">Facebook</a></p>
        </li>
        <li>
            <p><a href="https://www.instagram.com">Instagram</a></p>
        </li>
        <li>
            <p><a href="https://www.linkedin.com">Linkedin</a></p>
        </li>
        <li>
            <p><a href="https://www.youtube.com">Youtube</a></p>
        </li>
        <li>
            <p><a href="https://www.youtube.com">youtube</a></p>
        </li>
    </ul>

    <!-- 3.nav tag ke andar ek ul ke andar chaar list item chahta hu or har item ek link hoga -->
    <nav>
        <ol>
            <li style="display: inline;"><a href="">Home</a></li>
            <li style="display: inline;"><a href="">About</a></li>
            <li style="display: inline;"><a href="">Contact us</a></li>
            <li style="display: inline;"><a href="">Login</a></li>
        </ol>
    </nav>

</html>
