<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- this is div tag -->
    <!--this code segment is called as container -->
    <div class="conatiner">
        <!-- andar ye bhot sare elements ko contain kar rha hai -->
    <section>
        <ul>
            <li>A</li>
            <li>B</li>
        </ul>
        <footer></footer>
    </section>
    </div>

    <!-- wrapper kind class-->
    <!-- this code segment is called as wrapper -->
    <div class="wrapper">
        <!-- andar ye bhot sare elements ko wrap kar raha hai as a parent entity -->
        <header></header>
        <main></main>
        <footer></footer>

    </div>

    <!-- checking that div tag is a block element or inline element -->
    <!-- <div>This is my first div</div> -->
    <!-- how to know that it is block element or inline element
    simply fill the back ground colour -->
    <div style="background-color: aqua;">This is my first div</div>
    <!-- now we see that aqua color pure screen ki left to right width le rha hai or just hm log ne sikha tha ki jo block element hota hai wo entire screen ki left to right width le leta hai -->
    <!-- block elements jo hote hai wo same line me nhi aate hai...to ye div tag same line me nahi aayega -->
    <div style="background-color: aqua;">This is my first div</div>


    <!-- trying this same thing with span tag  -->
    <span style="background-color: yellow;">This is my first span tag</span>
    <!-- span tag is an inline element kyuki isme jitna content hai wo utna hi space le rhaa hai -->
    <!-- or inline elements jo hote hai wo same line me aate hai -->
    <span style="background-color: yellow;">This is my first span tag</span>

    <!-- checking that pragraph is a block or inline elememnt -->
    <p style="background-color: red;">First para</p>
    <p style="background-color: red;">Second para</p>
    <!-- hm dekh sakte hai ki paragraphs different line me aa rahe hai..now we can say that paragraph is a block element -->

    <!-- we can convert block elememnt into inline elememnt -->
    <span style="background-color: yellow;">This is my Second span tag</span>
    <p style="background-color: yellow; display: inline;">Hmlog is p tag ko inline elements me convert kar rahe hai</p>
    <!-- display inline karne se p tag jo block element ths wo inline element ban gaya -->


</body>
</html>
