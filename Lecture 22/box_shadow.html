<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
            /*root ke andar variables ko define karne se ho har jagah se accessible ho jati hai.*/
            --primary-color: brown; /* CSS variable declaration */
            --custom-width: 330px; 
        }
        .container{
            background-color: beige;
            border: 2px solid black;
            height: 650px;
            display: flex;
            justify-content: center; /* box ko horizontally center karne ke liye */
            align-items: center; /* box ko vertically center karne ke liye */   
        }

        .box{
            
            background-color: aquamarine;
            width: var(--custom-width); /* CSS variable usage */
            height: 330px;
            border: 1px solid var(--primary-color);
            margin: 5px;
            padding: 5px;

            /* box shadow using color  */
            /* box-shadow: 10px 15px brown;    */
            /* box-shadow: xoffset yoffset color; */

            /* box shadow using blur radius  */
            /* box-shadow: 10px 15px 5px brown;       */
            /* box-shadow: xoffset yoffset blur color; */
            
            /* box shadow using spread radius  */
            /* box-shadow: 10px 15px 5px 20px brown;           */
            /* box-shadow: xoffset yoffset blur spread  color; */

            /* box shadow using inset for iner shadow  */
            /* box-shadow: inset 10px 15px 5px brown; */
            /* box-shadow: inset xoffset yoffset blur color; */

            /* Applying multiple shadows */
            box-shadow: 10px 15px var(--primary-color), 15px 8px green;
        }
    </style>
</head>
<body>
    <!-- Shadows are of two types: 1. Box Shadow 2. Text Shadow -->
    <div class="container">

        <div class="box">
            <img src="imageFile.png" alt="Image">
            <h2>Welcome to CodeHelp</h2>
            <p>
                Lorem ipsum dolor sit amet consectetur adipisicing elit. Molestiae exercitationem quas quod, adipisci sapiente officiis provident. Quasi error hic beatae, minima quod cum cupiditate nesciunt nulla recusandae placeat, ipsam repellat?
            </p>
        </div>

    </div>
</body>
</html>
