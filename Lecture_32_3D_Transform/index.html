<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D Transforms</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            width: 100%;
            height: 100%;
        }
        .container{
            background-color: antiquewhite;
            padding: 5rem;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }
        .items{
            padding: 2rem;
            width: 150px;
            height: 150px;
            background-color: rgb(61, 178, 69);
            border: 2px solid black;
            color: white;
        }

        /* rotateX ko x direction me rotate karta hai */
        #rotateX:hover{
            transform: rotateX(45deg);
        }
        #rotateY:hover{
            transform: rotateY(-45deg);/*It will rotate anticlock wise according to Y axis*/
        }
        #rotateZ:hover{
            transform: rotateZ(45deg);
        }


        #translateX:hover{
            transform: translateX(100px);
        }
        #translateY:hover{
            transform: translateY(100px);
        }
        #translateZ:hover{
            transform:perspective(300px) translateZ(100px);/*we have to set a perspective(hm usko kitni distance se dekh rhe hai, for ex 300px dur se dekh rhe hai) also to see the effect*/
        }


        #scaleX:hover{
            transform: scaleX(1.5);
        }
        #scaleY:hover{
            transform: skewX(30deg);/*skew se item x axis ke towards tilt ho jayega*/
        }
        #scaleZ:hover{
            transform:perspective(300px) scaleZ(5) rotateY(30deg);/*z axis ke liye perspective add karna hoga*/
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="items" id="rotateX">RotateX</div>
        <div class="items" id="rotateY">RotateY</div>
        <div class="items" id="rotateZ">RotateZ</div>
        <div class="items" id="translateX">TranslateX</div>
        <div class="items" id="translateY">TranslateY</div>
        <div class="items" id="translateZ">TranslateZ</div>
        <div class="items" id="scaleX">ScaleX</div>
        <div class="items" id="scaleY">ScaleY</div>
        <div class="items" id="scaleZ">ScaleZ</div>
    </div>
</body>
</html>
