<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form One</title>
</head>
<body>
    <h2>Event Registration</h2>
    <form >

        <label for="name">Name:</label>
        <br/>
        <input type="text" id="name" name="name">
        <br/>
        <br/>

        <label for="emailid">Email ID:</label>
        <br/>
        <input type="email" id="emailid" name="emailid">
        <br/>
        <br/>

        <label for="emailid">Phone No:</label>
        <br/>
        <input type="email" id="emailid" name="emailid">
        <br/>
        <br/>

        <label for="occupationType">Occupation:</label>
        <br/>
        <select name="occupationType" id="occupationType"> <!--select tag foe making dropdown and option tag for making options-->
            <option value="student">Student</option>
            <option value="professional">Professional</option>
            <option value="other">Other</option>
        </select>
        <br/>
        <br/>

        <!--Grouping of element karne ke liye fieldset ka use karte hai-->
        <!--or uss group ke andar koi heading dene ke liye legend tag ka use kar skate hai-->
        <fieldset>
            <legend>Topic of interest</legend>

            <label for="checkbox1">HTML</label>
            <input type="checkbox" name="checkbox1" id="checkbox1">
            <br/>
            <br/>
            
            <label for="checkbox2">CSS</label>
            <input type="checkbox" name="checkbox2" id="checkbox2">
            <br/>
            <br/>

            <label for="checkbox3">JavaScript</label>
            <input type="checkbox" name="checkbox3" id="checkbox3">
            <br/>
            <br/>

        </fieldset>

        <!--Creating text area-->
        <label for="textarea1">Comments:</label>
        <br/>
        <textarea name="textarea1" id="textarea1" cols="30" rows="4"></textarea>

        <input type="submit" value="Register">
    </form>
</body>
</html>
