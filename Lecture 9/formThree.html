<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Three</title>
</head>
<body>
    <form>
        <h2>Complex Form</h2>
        <fieldset>
            <legend>Personal Information</legend>
            <label for="name">Name:</label>
            <input type="text" name="name" id="name">
            <br/>
            <br/>
            <label for="emailId">Email ID:</label>
            <input type="email" name="emailId" id="emailId">
            <br/>
            <br/>
            <label for="phoneNo">Phone:</label>
            <input type="phoneNo" name="phoneNo" id="phoneNo">
            <br/>
            <br/>
            <label for="dateOfBirth">Date Of Birth:</label>
            <input type="date" name="dateOfBirth" id="dateOfBirth">
            <br/>
            <br/>
            <span>Gender:</span>
            <input type="radio" name="radio" id="radio1">
            <label for="radio1">Male</label>
            <input type="radio" name="radio" id="radio2">
            <label for="radio1">Female</label>
            <br/>
            <br/>
            <label for="country">Country</label>
            <select name="country" id="country">
                <option value="india">India</option>
                <option value="US">United States</option>
                <option value="japan">Japan</option>
                <option value="UK">London</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>Address</legend>
            <label for="street">Street:</label>
            <input type="text" name="street" id="street">
            <br/>
            <br/>
            <label for="city">City</label>
            <input type="text" name="city" id="city">
            <br/>
            <br/>
            <label for="state">State</label>
            <input type="text" name="state" id="state">
            <br/>
            <br/>
            <label for="zipcode">Zip Code</label>
            <input type="text" name="zipcode" id="zipcode">
        </fieldset>

        <fieldset>
            <legend>Other Information</legend>
            <label for="textarea1">Comments:</label>
            <br/>
            <textarea name="textarea1" id="textarea1" cols="20" rows="5"></textarea>
            
            <label for="terms">I agrre to the terms of Service:</label>
            <input type="checkbox" name="terms" id="terms">

        </fieldset>
        <br/>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
